name: Gradle Smoke Test

# =============================================================================
# Quick sanity check that the Gradle project syncs without the full LLVM
# build. Runs on every push + PR. Takes ~5 min.
#
# This catches:
#   - Malformed build.gradle.kts
#   - Wrong version catalog entries
#   - Missing dependencies
#   - Compose compiler errors
# =============================================================================

on:
  push:
    branches: [main, dev]
    paths:
      - 'android/pocos3-ui/**'
      - '.github/workflows/gradle-smoke.yml'
  pull_request:
    paths:
      - 'android/pocos3-ui/**'

jobs:
  gradle-sync:
    name: Gradle sync (no native build)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout PocoS3
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/pocos3-ui/.gradle
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('android/pocos3-ui/**/*.gradle*', 'android/pocos3-ui/**/libs.versions.toml') }}
          restore-keys: gradle-smoke-${{ runner.os }}-

      - name: Gradle dependency dump
        working-directory: android/pocos3-ui
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon

      - name: Lint Kotlin (basic)
        working-directory: android/pocos3-ui
        run: ./gradlew :app:lintRelease --no-daemon -x externalNativeBuildRelease -x externalNativeBuildDebug
        continue-on-error: true
