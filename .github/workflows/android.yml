name: Build PocoS3 APK

# =============================================================================
# GitHub Actions workflow for PocoS3. Builds arm64-v8a APK + (on tags) release.
# =============================================================================

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build arm64-v8a APK
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018

    steps:
      - name: Checkout PocoS3
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 ndk;27.2.12479018 cmake;3.31.0'

      - name: Install Ninja + ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-android-release-a13
          key: cmake-${{ runner.os }}-${{ hashFiles('third_party/rpcs3/**/CMakeLists.txt', 'android/CMakeLists.txt', 'android/src/*.cpp') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/pocos3-ui/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/pocos3-ui/**/*.gradle*', 'android/pocos3-ui/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch non-submodule dependencies
        run: |
          git clone --depth 1 https://github.com/SnowflakePowered/librashader 3rdparty/librashader || true
          git clone --depth 1 https://github.com/bylaws/libadrenotools android/pocos3-ui/app/src/main/cpp/libadrenotools || true
          # Fetch xioTechnologies Fusion (sensor fusion library used by PadHandler.h)
          git clone --depth 1 https://github.com/xioTechnologies/Fusion third_party/rpcs3/3rdparty/fusion/fusion || true

      - name: Apply PocoS3 patches (no-op if no patches present)
        run: ./patches/apply.sh third_party/rpcs3

      - name: Free up disk space on the runner
        run: |
          # Do NOT delete /usr/local/lib/android — that is where the NDK lives!
          # Deleting it causes CMake to fail with "Could not find toolchain file".
          sudo rm -rf /usr/share/dotnet \
                     /opt/ghc /usr/local/share/boost \
                     /usr/local/share/vcpkg /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Fetch LLVM (the one giant dep not inlined in the repo)
        run: |
          chmod +x scripts/fetch-llvm.sh
          ./scripts/fetch-llvm.sh
          df -h /

      - name: Configure CMake (native core)
        run: |
          cmake -S . -B build-android-release-a13 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DANDROID_STL=c++_shared \
            -DLLVM_TARGETS_TO_BUILD="AArch64;PowerPC;X86" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_PRECOMPILED_HEADERS=ON \
            -DBUILD_LLVM=ON \
            -DWITH_LLVM=ON \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_SYSTEM_OPENAL=OFF \
            -DUSE_SYSTEM_PUGIXML=OFF \
            -DUSE_SYSTEM_LIBUSB=OFF \
            -DUSE_SYSTEM_VULKAN_MEMORY_ALLOCATOR=OFF \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_SYSTEM_CUBEB=OFF \
            -DUSE_SYSTEM_FFMPEG=OFF \
            -DUSE_SYSTEM_FAUDIO=OFF \
            -DUSE_SYSTEM_MVK=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DFFMPEG_CORE_NAME=3rdparty_ffmpeg \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DPOCOS3_BUILD_GLUE=OFF

      - name: Build native core (libpocos3-core.so)
        run: |
          # -j2 to avoid OOM during LLVM linking on 16 GB runners.
          cmake --build build-android-release-a13 --target pocos3-core -j2
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded build-android-release-a13/android/libpocos3-core.so
          mkdir -p android/pocos3-ui/app/src/main/jniLibs/arm64-v8a
          cp build-android-release-a13/android/libpocos3-core.so \
             android/pocos3-ui/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: android/pocos3-ui
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK (only on tagged release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/pocos3-ui/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.POCOS3_SIGNING_KEY }}
          alias: ${{ secrets.POCOS3_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.POCOS3_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.POCOS3_KEY_PASSWORD }}

      - name: Stage artifact
        run: |
          mkdir -p build/dist
          cp android/pocos3-ui/app/build/outputs/apk/release/*.apk build/dist/pocos3-arm64-v8a.apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocos3-apk-arm64-v8a
          path: build/dist/*.apk
          if-no-files-found: warn

      - name: Create GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.apk
          generate_release_notes: true
          draft: true
