name: Build PocoS3 APK

# =============================================================================
# GitHub Actions workflow for PocoS3.
#
# Produces a signed-or-unsigned APK for arm64-v8a. The first run takes
# 45-75 minutes (mostly LLVM compile); subsequent runs are 8-15 minutes
# if the NDK + Gradle caches hit.
# =============================================================================

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for tag-based release uploads

jobs:
  build-apk:
    name: Build arm64-v8a APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_HOME: $ANDROID_SDK_ROOT
      ANDROID_NDK_HOME: $ANDROID_SDK_ROOT/ndk/27.2.12479018
      JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

    steps:
      - name: Checkout PocoS3
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 ndk;27.2.12479018 cmake;3.31.0'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ndk-27.2.12479018-${{ runner.os }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-android-release-a13
          key: cmake-${{ runner.os }}-${{ hashFiles('third_party/rpcs3/**/CMakeLists.txt', 'patches/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/pocos3-ui/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/pocos3-ui/**/*.gradle*', 'android/pocos3-ui/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch non-submodule dependencies
        run: |
          git clone https://github.com/SnowflakePowered/librashader 3rdparty/librashader || true
          git clone https://github.com/bylaws/libadrenotools android/pocos3-ui/app/src/main/cpp/libadrenotools || true

      - name: Apply PocoS3 patches to upstream RPCS3
        run: ./patches/apply.sh third_party/rpcs3

      - name: Configure CMake (native core)
        run: |
          cmake -S . -B build-android-release-a13 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DANDROID_STL=c++_shared \
            -DLLVM_TARGETS_TO_BUILD="AArch64;PowerPC;X86" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_PRECOMPILED_HEADERS=ON

      - name: Build native core
        run: |
          cmake --build build-android-release-a13 --target pocos3-core -j$(nproc)
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded build-android-release-a13/android/libpocos3-core.so
          mkdir -p android/pocos3-ui/app/src/main/jniLibs/arm64-v8a
          cp build-android-release-a13/android/libpocos3-core.so \
             android/pocos3-ui/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: android/pocos3-ui
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK (debug key, for sideload only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/pocos3-ui/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.POCOS3_SIGNING_KEY }}
          alias: ${{ secrets.POCOS3_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.POCOS3_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.POCOS3_KEY_PASSWORD }}

      - name: Rename artifact
        run: |
          mkdir -p build/dist
          cp android/pocos3-ui/app/build/outputs/apk/release/*.apk build/dist/pocos3-arm64-v8a.apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocos3-apk-arm64-v8a
          path: build/dist/*.apk
          if-no-files-found: warn

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.apk
          generate_release_notes: true
          draft: true
