# PocoS3 UI gradle.properties

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Gradle config
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# PocoS3: which variant to build by default. Override per-build via -Ppocos3.*.
pocos3.minSdk=33
pocos3.variant=debug

# Compose: disable live literals in release builds (they cause flicker).
android.compose.liveLiterals.enabled=true
